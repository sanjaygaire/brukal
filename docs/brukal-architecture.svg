<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 860" font-family="'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#334155"/>
    </marker>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#16a34a"/>
    </marker>
    <style>
      .zone   { rx:14; ry:14; stroke-width:2; }
      .box    { rx:9; ry:9; stroke-width:1.5; fill:#ffffff; }
      .zt     { font-size:15px; font-weight:700; letter-spacing:.3px; }
      .bt     { font-size:14px; font-weight:600; fill:#0f172a; }
      .sub    { font-size:12px; fill:#475569; }
      .lbl    { font-size:12px; font-weight:600; }
      .flow   { fill:none; stroke:#334155; stroke-width:2; }
    </style>
  </defs>

  <rect x="0" y="0" width="1300" height="860" fill="#f8fafc"/>
  <text x="650" y="40" text-anchor="middle" font-size="26" font-weight="800" fill="#0f172a">Brukal — Trust-Governed Multi-Agent Pentest Architecture</text>
  <text x="650" y="66" text-anchor="middle" font-size="14" fill="#475569">The model <tspan font-style="italic">proposes</tspan> (text only) · deterministic code <tspan font-style="italic">disposes</tspan> · one door · everything grounded &amp; audited</text>

  <!-- ===================== CONTROL PLANE ===================== -->
  <rect class="zone" x="30" y="100" width="360" height="470" fill="#eff6ff" stroke="#2563eb"/>
  <text class="zt" x="210" y="126" text-anchor="middle" fill="#1d4ed8">CONTROL PLANE — proposes (text only)</text>

  <rect class="box" x="55" y="146" width="310" height="66" stroke="#93c5fd"/>
  <text class="bt" x="210" y="172" text-anchor="middle">LLM brain</text>
  <text class="sub" x="210" y="192" text-anchor="middle">Claude · DeepSeek · Groq · Ollama (provider-agnostic)</text>

  <rect class="box" x="55" y="230" width="310" height="78" stroke="#93c5fd"/>
  <text class="bt" x="210" y="256" text-anchor="middle">Strategist · GroundedLoop</text>
  <text class="sub" x="210" y="276" text-anchor="middle">reason → propose → run → OBSERVE → re-plan</text>
  <text class="sub" x="210" y="293" text-anchor="middle">anti-hallucination · coach-not-abort · no prose success</text>

  <rect class="box" x="55" y="326" width="310" height="96" stroke="#93c5fd" fill="#f8fbff"/>
  <text class="bt" x="210" y="350" text-anchor="middle">Reference — labelled, UNTRUSTED data</text>
  <text class="sub" x="210" y="370" text-anchor="middle">① trusted lessons (verified wins only)</text>
  <text class="sub" x="210" y="387" text-anchor="middle">② local skill playbooks</text>
  <text class="sub" x="210" y="404" text-anchor="middle">③ web research (control-plane egress, never the cage)</text>

  <rect class="box" x="55" y="440" width="310" height="60" stroke="#93c5fd" fill="#f8fbff"/>
  <text class="bt" x="210" y="464" text-anchor="middle">Verifier → solved?</text>
  <text class="sub" x="210" y="484" text-anchor="middle">flag / foothold confirmed from REAL gated output</text>

  <!-- ===================== THE GATE ===================== -->
  <rect class="zone" x="470" y="100" width="360" height="470" fill="#fef2f2" stroke="#dc2626"/>
  <text class="zt" x="650" y="126" text-anchor="middle" fill="#b91c1c">THE GATE — deterministic, NO LLM</text>

  <rect class="box" x="495" y="146" width="310" height="150" stroke="#fca5a5"/>
  <text class="bt" x="650" y="170" text-anchor="middle">Hard gate — a logical AND</text>
  <text class="sub" x="650" y="192" text-anchor="middle">injection guard</text>
  <text class="sub" x="650" y="210" text-anchor="middle">→ parse (shlex)</text>
  <text class="sub" x="650" y="228" text-anchor="middle">→ tool allowlist</text>
  <text class="sub" x="650" y="246" text-anchor="middle">→ scope / hostmatch (every host, every spelling)</text>
  <text class="sub" x="650" y="264" text-anchor="middle">→ no smuggled host  → rate limit</text>
  <text x="650" y="285" text-anchor="middle" font-size="11" font-style="italic" fill="#b91c1c">can only DENY — never widen</text>

  <rect class="box" x="495" y="312" width="310" height="66" stroke="#fca5a5"/>
  <text class="bt" x="650" y="338" text-anchor="middle">Soft risk layer</text>
  <text class="sub" x="650" y="358" text-anchor="middle">reversibility × blast-radius × agent trust Tᵢ</text>

  <!-- verdicts -->
  <rect class="box" x="495" y="400" width="96" height="50" stroke="#16a34a" fill="#f0fdf4"/>
  <text x="543" y="422" text-anchor="middle" class="lbl" fill="#15803d">ALLOW</text>
  <text x="543" y="439" text-anchor="middle" font-size="10" fill="#15803d">runs</text>

  <rect class="box" x="602" y="400" width="96" height="50" stroke="#d97706" fill="#fffbeb"/>
  <text x="650" y="422" text-anchor="middle" class="lbl" fill="#b45309">ESCALATE</text>
  <text x="650" y="439" text-anchor="middle" font-size="10" fill="#b45309">human y/N</text>

  <rect class="box" x="709" y="400" width="96" height="50" stroke="#dc2626" fill="#fef2f2"/>
  <text x="757" y="422" text-anchor="middle" class="lbl" fill="#b91c1c">DENY</text>
  <text x="757" y="439" text-anchor="middle" font-size="10" fill="#b91c1c">never runs</text>

  <rect class="box" x="495" y="470" width="310" height="80" stroke="#fca5a5" fill="#fff7f7"/>
  <text class="bt" x="650" y="494" text-anchor="middle">Executor.run — THE ONE DOOR</text>
  <text class="sub" x="650" y="514" text-anchor="middle">gate → log → (maybe) run. Agents get the Executor,</text>
  <text class="sub" x="650" y="531" text-anchor="middle">never the cage. Every action passes here.</text>

  <!-- ===================== EXECUTION PLANE ===================== -->
  <rect class="zone" x="910" y="100" width="360" height="470" fill="#f0fdf4" stroke="#16a34a"/>
  <text class="zt" x="1090" y="126" text-anchor="middle" fill="#15803d">EXECUTION PLANE — the cage</text>

  <rect class="box" x="935" y="146" width="310" height="86" stroke="#86efac"/>
  <text class="bt" x="1090" y="170" text-anchor="middle">DockerKali cage</text>
  <text class="sub" x="1090" y="190" text-anchor="middle">~600 Kali tools · no shell · container-side timeout</text>
  <text class="sub" x="1090" y="208" text-anchor="middle">GovernedBrowser (headless Chrome, request tamper)</text>
  <text class="sub" x="1090" y="225" text-anchor="middle">non-root exec, unprivileged</text>

  <rect class="box" x="935" y="250" width="310" height="70" stroke="#86efac" fill="#f6fef9"/>
  <text class="bt" x="1090" y="274" text-anchor="middle">nftables egress lock (kernel)</text>
  <text class="sub" x="1090" y="294" text-anchor="middle">default-drop; only scope + VPN + DNS allowed —</text>
  <text class="sub" x="1090" y="311" text-anchor="middle">a slip past the text gate still can't leave scope</text>

  <rect class="box" x="935" y="340" width="310" height="60" stroke="#86efac"/>
  <text class="bt" x="1090" y="364" text-anchor="middle">Authorised target</text>
  <text class="sub" x="1090" y="384" text-anchor="middle">reached over the VPN (tun0), in-scope only</text>

  <rect class="box" x="935" y="440" width="310" height="60" stroke="#86efac" fill="#f6fef9"/>
  <text class="bt" x="1090" y="464" text-anchor="middle">REAL output</text>
  <text class="sub" x="1090" y="484" text-anchor="middle">the only thing that counts as progress / success</text>

  <!-- ===================== AUDIT ===================== -->
  <rect class="zone" x="30" y="620" width="1240" height="86" fill="#f1f5f9" stroke="#475569"/>
  <text class="zt" x="650" y="650" text-anchor="middle" fill="#334155">AUDIT — append-only, hash-chained, tamper-evident (optional HMAC via BRUKAL_AUDIT_KEY)</text>
  <text class="sub" x="650" y="676" text-anchor="middle">every decision + every result is written here — a verifiable receipt for the whole engagement (brukal verify)</text>

  <!-- ===================== FLOWS ===================== -->
  <!-- control -> gate (Action Request) -->
  <path class="flow" d="M365,264 C410,264 430,220 493,220" marker-end="url(#arrow)"/>
  <text class="lbl" x="405" y="212" text-anchor="middle" fill="#334155">Action</text>
  <text class="lbl" x="405" y="226" text-anchor="middle" fill="#334155">Request</text>

  <!-- reference -> strategist (feeds proposal) -->
  <path class="flow" d="M210,326 L210,308" marker-end="url(#arrow)"/>

  <!-- one door -> cage (ALLOW/ESCALATE) -->
  <path d="M805,510 C860,510 880,220 933,189" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <text class="lbl" x="866" y="360" text-anchor="middle" fill="#15803d">ALLOW /</text>
  <text class="lbl" x="866" y="374" text-anchor="middle" fill="#15803d">ESCALATE✓</text>

  <!-- DENY dead-ends -->
  <path d="M757,450 L757,470" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrowRed)"/>

  <!-- cage REAL output -> verifier (feedback / grounding) -->
  <path d="M933,470 C700,470 470,470 367,470" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
  <text class="lbl" x="650" y="462" text-anchor="middle" fill="#1d4ed8">REAL output feeds the next decision (grounding)</text>

  <!-- verifier -> strategist -->
  <path class="flow" d="M150,440 L150,308" marker-end="url(#arrow)"/>
  <!-- verifier -> trusted lessons (verified win) -->
  <path d="M270,440 C300,420 260,400 210,392" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrowGreen)"/>
  <text class="lbl" x="322" y="430" text-anchor="middle" fill="#15803d">verified win</text>

  <!-- gate -> audit, cage -> audit -->
  <path class="flow" d="M650,550 L650,618" marker-end="url(#arrow)"/>
  <path class="flow" d="M1090,500 L1090,600 L1090,618" marker-end="url(#arrow)"/>
  <path class="flow" d="M210,500 L210,600 L210,618" marker-end="url(#arrow)"/>

  <!-- five invariants footer -->
  <text x="650" y="740" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">FIVE INVARIANTS (law)</text>
  <text x="650" y="762" text-anchor="middle" font-size="12" fill="#475569">1 · No LLM inside the gate  &#160;&#160; 2 · Fail-closed  &#160;&#160; 3 · Never trust an agent's self-report</text>
  <text x="650" y="782" text-anchor="middle" font-size="12" fill="#475569">4 · One execution path (Executor.run)  &#160;&#160; 5 · Immutable scope, append-only audit</text>
  <text x="650" y="818" text-anchor="middle" font-size="11" fill="#94a3b8">github.com/sanjaygaire/brukal — a regex cannot be prompt-injected; an LLM guard can.</text>
</svg>
