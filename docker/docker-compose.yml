# Brings up the Kali cage as a long-lived container named `brukal-kali`.
#
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Network isolation
# -----------------
# By default this container is placed on an isolated bridge network. To let it
# reach ONLY your authorised lab range, attach that network here and keep this
# container off any network that can reach the wider internet or your host LAN.
# The gate enforces scope in software; this network boundary is defence in
# depth at the infrastructure layer (belt and braces).
services:
  kali:
    build:
      context: .
      dockerfile: Dockerfile.kali
    container_name: brukal-kali
    networks:
      - brukal_isolated
    # Raw-socket scanning (nmap SYN/service/OS detection). These caps are in the
    # container's bounding set; the Dockerfile grants them to the nmap binary
    # only, so nothing else in the cage gains privilege.
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # OpenVPN needs a tun device to reach a lab/HTB network. Drop your .ovpn at
    # docker/vpn/config.ovpn (gitignored) and the entrypoint brings the VPN up;
    # with no config it runs in plain local mode.
    devices:
      - /dev/net/tun
    volumes:
      - ./vpn:/vpn:ro
      # The Obsidian vault + cross-session lessons live here, bind-mounted so they
      # persist across container restarts and are visible to both the cage and the
      # host (open ./docker/vault in Obsidian). Point Brukal at it with
      # `--vault docker/vault`; the shared lessons file is docker/vault/lessons.jsonl.
      - ./vault:/vault
    # No published ports: nothing inbound. The only way in is `docker exec`,
    # which the executor uses for approved commands.

networks:
  brukal_isolated:
    driver: bridge
    internal: false   # set true to fully cut internet; attach a lab net to reach targets
